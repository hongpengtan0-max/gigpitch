<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GigPitch — local bid assistant</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui,"Noto Sans CJK SC",sans-serif;max-width:980px;margin:24px auto;padding:0 16px;color:#222;background:#faf8f4}
h1{margin:0}small{color:#777}textarea{width:100%;height:120px;font:inherit;padding:8px}button{background:#08785C;color:#fff;border:0;padding:10px 18px;font-size:16px;border-radius:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #e5e0d6;border-radius:8px;padding:12px;white-space:pre-wrap}
.card h3{margin:0 0 6px;color:#08785C;font-size:15px}.price{font-size:28px;color:#C89850;font-weight:700}</style></head><body>
<h1>GigPitch 🎯</h1><small>Paste a gig brief → analysis, quote, bilingual bid, deliverables, logo prompts. Runs 100% locally on Gemma 3 via Ollama, orchestrated by Mastra.</small>
<p><textarea id="b">需求：我们是一家社区咖啡店「豆仓 Bean Barn」，想要一个温暖、手作感的LOGO，配色偏棕色和奶油色，还需要名片和外带杯包装设计。预算800元，希望一周内完成。</textarea></p>
<button id="go">Generate pitch</button> <span id="st"></span>
<div class="grid" id="out"></div>
<script>
const esc=s=>String(s??'').replace(/\*\*/g,'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
go.onclick=async()=>{st.textContent='Thinking locally…';out.innerHTML='';const t=Date.now();
const r=await fetch('/api/pitch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brief:b.value})}).then(r=>r.json());
if(r.error){st.textContent='Error: '+r.error;return}
st.textContent=`Done in ${((Date.now()-t)/1000).toFixed(1)}s · model ${r.model} · no data left this machine`;
const a=r.analysis,q=r.quote;const card=(h,c)=>`<div class="card"><h3>${h}</h3>${c}</div>`;
out.innerHTML=card('① Brief analysis',esc(`${a.brand_name} · ${a.industry}\n${a.summary_zh}\nStyle: ${(a.style_keywords||[]).join(', ')}\nVI: ${a.needs_vi} · urgent: ${a.urgent} · budget: ${a.budget_cny??'—'}`))
+card('② Quote suggestion',`<div class="price">¥${q.cny} <small>≈ $${q.usd}</small></div>`+esc(q.rationale.join('\n')+'\n\nMatched portfolio: '+r.cases.map(c=>c.title).join(' / ')))
+card('③ 中文投标文案',esc(r.bid_zh))+card('③ English bid',esc(r.bid_en))
+card('④ Deliverables checklist',esc(r.checklist))+card('⑤ Logo prompt ideas',esc(r.prompts));};
</script></body></html>
